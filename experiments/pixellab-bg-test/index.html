<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Two Fires — Industrial Parallax Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080b14; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; }
    #game-container { image-rendering: pixelated; box-shadow: 0 0 60px rgba(0,0,0,0.8); }
    #info {
      color: #556; font: 11px monospace; margin-top: 10px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
<div id="game-container"></div>
<div id="info">← → / A D  move &nbsp;·&nbsp; ↑ / W / Space  jump &nbsp;·&nbsp; All assets: PixelLab AI</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const CANVAS_W  = 480;
const CANVAS_H  = 270;
const SCALE     = 3;
const TILE_W    = 16;
const TILE_H    = 16;
const LEVEL_W   = 90;   // tiles
const LEVEL_H   = 17;   // tiles  (17 × 16 = 272 ≈ 270)
const GROUND_Y  = 13;   // tile row where ground top starts
const WORLD_PX_W = LEVEL_W * TILE_W;  // 1440
const WORLD_PX_H = LEVEL_H * TILE_H;  // 272

// Floating platform definitions: [tileX, tileY, widthInTiles]
const PLATFORMS = [
  [10, 9, 8],
  [25, 9, 6],
  [42, 9, 8],
  [60, 9, 5],
  [72, 9, 7],
];

// ─── Phaser config ────────────────────────────────────────────────────────────
const config = {
  type: Phaser.AUTO,
  width:  CANVAS_W,
  height: CANVAS_H,
  zoom:   SCALE,
  backgroundColor: '#0d1120',
  parent: 'game-container',
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 500 }, debug: false }
  },
  scene: { preload, create, update }
};

new Phaser.Game(config);

// ─── Scene state ──────────────────────────────────────────────────────────────
let player, cursors, wasd;
let bg1, bg2, bg3;
let solidGroup;     // static physics bodies (invisible — visuals drawn separately)
let tileGraphics;   // tiled visuals from tileset
let enemies = [];

// Sprite handles (loaded after preload — may fallback to image)
let soldierEastImg, soldierWestImg, droneEastImg, droneWestImg;

// ─── Preload ──────────────────────────────────────────────────────────────────
function preload() {
  this.load.image('bg1', 'assets/bg-layer1-sky.png');
  this.load.image('bg2', 'assets/bg-layer2-buildings.png');
  this.load.image('bg3', 'assets/bg-layer3-machinery.png');

  // Tileset — 6 tiles × 16px = 96px wide strip
  this.load.spritesheet('tiles', 'assets/tileset-industrial.png',
    { frameWidth: TILE_W, frameHeight: TILE_H });

  // Characters as plain images (static poses, flipped for direction)
  this.load.image('soldier-e', 'assets/character-soldier.png');
  this.load.image('soldier-w', 'assets/character-soldier-west.png');
  this.load.image('drone-e',   'assets/enemy-drone.png');
  this.load.image('drone-w',   'assets/enemy-drone-west.png');

  // Decorations
  this.load.image('crate',    'assets/obj-crate.png');
  this.load.image('pipe',     'assets/obj-pipe.png');
  this.load.image('light',    'assets/obj-light.png');
  this.load.image('conveyor', 'assets/obj-conveyor.png');
}

// ─── Create ───────────────────────────────────────────────────────────────────
function create() {
  this.physics.world.setBounds(0, 0, WORLD_PX_W, WORLD_PX_H);

  // ── Parallax backgrounds (scrollFactor 0, tilePositionX driven in update) ──
  bg1 = this.add.tileSprite(0, 0, CANVAS_W, CANVAS_H, 'bg1')
    .setOrigin(0).setScrollFactor(0).setDepth(0);
  bg2 = this.add.tileSprite(0, 0, CANVAS_W, CANVAS_H, 'bg2')
    .setOrigin(0).setScrollFactor(0).setDepth(1);
  bg3 = this.add.tileSprite(0, 0, CANVAS_W, CANVAS_H, 'bg3')
    .setOrigin(0).setScrollFactor(0).setDepth(2);

  // ── Solid platform group (invisible physics rects) ────────────────────────
  solidGroup = this.physics.add.staticGroup();
  addSolidRect.call(this,
    WORLD_PX_W / 2, GROUND_Y * TILE_H + 1,
    WORLD_PX_W, 2);  // ground top edge

  for (const [tx, ty, tw] of PLATFORMS) {
    addSolidRect.call(this,
      (tx + tw / 2) * TILE_W,
      ty * TILE_H + 1,
      tw * TILE_W, 2);
  }

  // ── Tile visuals ──────────────────────────────────────────────────────────
  // Use tiles spritesheet if loaded; fall back to procedural graphics.
  if (this.textures.exists('tiles')) {
    drawTiledPlatforms.call(this);
  } else {
    drawProceduralPlatforms.call(this);
  }

  // ── Decorations ──────────────────────────────────────────────────────────
  spawnDecorations.call(this);

  // ── Enemies ───────────────────────────────────────────────────────────────
  spawnEnemies.call(this);

  // ── Player ────────────────────────────────────────────────────────────────
  const spawnX = 80;
  const spawnY = GROUND_Y * TILE_H - 26;
  player = this.physics.add.image(spawnX, spawnY, 'soldier-e')
    .setDepth(20)
    .setCollideWorldBounds(true)
    .setMaxVelocityY(600)
    .setOrigin(0.5, 1);  // anchor at bottom-center

  // Trim hitbox to ~inner 20px wide, 36px tall
  player.setSize(20, 36).setOffset(14, 12);

  this.physics.add.collider(player, solidGroup);

  // ── Camera ────────────────────────────────────────────────────────────────
  this.cameras.main.setBounds(0, 0, WORLD_PX_W, WORLD_PX_H);
  this.cameras.main.startFollow(player, true, 0.1, 0.1);

  // ── Input ─────────────────────────────────────────────────────────────────
  cursors = this.input.keyboard.createCursorKeys();
  wasd    = this.input.keyboard.addKeys({
    up:    Phaser.Input.Keyboard.KeyCodes.W,
    left:  Phaser.Input.Keyboard.KeyCodes.A,
    right: Phaser.Input.Keyboard.KeyCodes.D,
    space: Phaser.Input.Keyboard.KeyCodes.SPACE,
  });
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function addSolidRect(cx, cy, w, h) {
  const r = this.add.rectangle(cx, cy, w, h, 0x000000, 0).setDepth(-1);
  this.physics.add.existing(r, true);
  solidGroup.add(r);
}

function drawTiledPlatforms() {
  const depth = 10;

  // Tile frame mapping (6-tile strip: 0=top-edge, 1=fill, 2=left-cap, 3=right-cap, 4=grating, 5=rust)
  const TOP   = 0;
  const FILL  = 1;
  const LCAP  = 2;
  const RCAP  = 3;

  const placeTile = (tx, ty, frame) => {
    this.add.image(tx * TILE_W + TILE_W/2, ty * TILE_H + TILE_H/2, 'tiles', frame)
      .setDepth(depth);
  };

  // Ground — 4 rows tall
  for (let x = 0; x < LEVEL_W; x++) {
    const f0 = (x === 0) ? LCAP : (x === LEVEL_W-1) ? RCAP : TOP;
    placeTile(x, GROUND_Y,   f0);
    placeTile(x, GROUND_Y+1, FILL);
    placeTile(x, GROUND_Y+2, FILL);
    placeTile(x, GROUND_Y+3, FILL);
  }

  // Floating platforms — 2 rows tall
  for (const [tx, ty, tw] of PLATFORMS) {
    for (let i = 0; i < tw; i++) {
      const f = (i === 0) ? LCAP : (i === tw-1) ? RCAP : TOP;
      placeTile(tx+i, ty,   f);
      placeTile(tx+i, ty+1, FILL);
    }
  }
}

function drawProceduralPlatforms() {
  // Fallback: draw colored rectangles that mimic industrial metal
  const g = this.add.graphics().setDepth(10);

  const drawPlat = (px, py, pw, ph) => {
    // Base: dark steel
    g.fillStyle(0x1e2535);
    g.fillRect(px, py, pw, ph);
    // Top highlight stripe (lighter edge)
    g.fillStyle(0x3a4a6a);
    g.fillRect(px, py, pw, 2);
    // Bottom shadow
    g.fillStyle(0x0d1020);
    g.fillRect(px, py + ph - 2, pw, 2);
    // Left/right edge caps
    g.fillStyle(0x2a3a55);
    g.fillRect(px, py+2, 2, ph-4);
    g.fillRect(px+pw-2, py+2, 2, ph-4);
    // Rivet dots
    g.fillStyle(0x556688);
    const rivPad = 6;
    for (let rx = px + rivPad; rx < px + pw - rivPad; rx += 12) {
      g.fillRect(rx, py+2, 2, 2);
      g.fillRect(rx, py+ph-4, 2, 2);
    }
  };

  // Ground
  drawPlat(0, GROUND_Y*TILE_H, WORLD_PX_W, 4*TILE_H);

  // Floating platforms
  for (const [tx, ty, tw] of PLATFORMS) {
    drawPlat(tx*TILE_W, ty*TILE_H, tw*TILE_W, 2*TILE_H);
  }
}

function spawnDecorations() {
  const gy = GROUND_Y * TILE_H;

  // Crates
  for (const x of [180, 350, 580, 820, 1060]) {
    this.add.image(x, gy, 'crate').setOrigin(0.5, 1).setDepth(15);
  }
  // Steam pipes (taller — anchor bottom)
  for (const x of [130, 460, 740, 1120]) {
    this.add.image(x, gy, 'pipe').setOrigin(0.5, 1).setDepth(15);
  }
  // Warning lights near ceiling
  for (const x of [210, 420, 660, 900, 1260]) {
    this.add.image(x, 20, 'light').setOrigin(0.5, 0).setDepth(15);
  }
  // Conveyor belts on ground
  for (const x of [270, 620, 980]) {
    this.add.image(x, gy, 'conveyor').setOrigin(0.5, 1).setDepth(15);
  }

  // Platform objects (on floating platforms)
  for (const [tx, ty, tw] of PLATFORMS) {
    const platTop = ty * TILE_H;
    const midX    = (tx + tw/2) * TILE_W;
    this.add.image(midX, platTop, 'crate').setOrigin(0.5, 1).setDepth(15);
  }
}

function spawnEnemies() {
  const configs = [
    { x: 310,  y: GROUND_Y  * TILE_H - 16, speed: 45, range: 70 },
    { x: 580,  y: GROUND_Y  * TILE_H - 16, speed: 38, range: 55 },
    { x: 17*TILE_W, y: 9*TILE_H - 16,      speed: 50, range: 48 },
    { x: 42*TILE_W + 32, y: 9*TILE_H - 16, speed: 42, range: 60 },
    { x: 950,  y: GROUND_Y  * TILE_H - 16, speed: 55, range: 80 },
  ];

  for (const cfg of configs) {
    const dr = this.physics.add.image(cfg.x, cfg.y, 'drone-e')
      .setDepth(18)
      .setGravityY(-500)  // counteract world gravity
      .setOrigin(0.5, 1)
      .setImmovable(true);

    dr.setData('dir',    1);
    dr.setData('speed',  cfg.speed);
    dr.setData('originX', cfg.x);
    dr.setData('range',  cfg.range);
    dr.setData('facingRight', true);
    dr.setData('bobPhase', Math.random() * Math.PI * 2);  // random phase for bobbing
    enemies.push(dr);
  }
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update(time, delta) {
  const onGround  = player.body.blocked.down;
  const goLeft    = cursors.left.isDown  || wasd.left.isDown;
  const goRight   = cursors.right.isDown || wasd.right.isDown;
  const jumpPress = Phaser.Input.Keyboard.JustDown(cursors.up)    ||
                    Phaser.Input.Keyboard.JustDown(wasd.up)       ||
                    Phaser.Input.Keyboard.JustDown(wasd.space);

  // Movement
  if (goLeft) {
    player.setVelocityX(-110);
    player.setTexture('soldier-w');
  } else if (goRight) {
    player.setVelocityX(110);
    player.setTexture('soldier-e');
  } else {
    player.setVelocityX(0);
  }

  if (jumpPress && onGround) {
    player.setVelocityY(-270);
  }

  // Drone patrol + bob
  const t = time / 1000;
  for (const dr of enemies) {
    const dir   = dr.getData('dir');
    const speed = dr.getData('speed');
    const ox    = dr.getData('originX');
    const range = dr.getData('range');
    const phase = dr.getData('bobPhase');

    dr.setVelocityX(dir * speed);
    // Gentle vertical bob
    dr.body.reset(dr.x, dr.getData('baseY') ?? (dr.y));
    if (!dr.getData('baseY')) dr.setData('baseY', dr.y);
    dr.y = dr.getData('baseY') + Math.sin(t * 2 + phase) * 3;

    const right = dr.getData('facingRight');
    if (dr.x > ox + range && right) {
      dr.setData('dir', -1);
      dr.setData('facingRight', false);
      dr.setTexture('drone-w');
    } else if (dr.x < ox - range && !right) {
      dr.setData('dir', 1);
      dr.setData('facingRight', true);
      dr.setTexture('drone-e');
    }
  }

  // Parallax
  const camX = this.cameras.main.scrollX;
  bg1.tilePositionX = camX * 0.05;
  bg2.tilePositionX = camX * 0.22;
  bg3.tilePositionX = camX * 0.48;
}
</script>
</body>
</html>
